<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BrainSync | Login</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="offer-bar">70% OFF!!! ✚ Sale Ends Soon, Get It Now →</div>
  
  <header class="navbar">
    <div class="logo">BRAIN<span>SYNC</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="features.html">Features</a>
      <a href="about.html">About Us</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="nav-actions">
      <a href="signup.html" class="link-small">Sign Up</a>
      <a href="login.html" class="btn btn-yellow active">Login</a>
    </div>
  </header>

  <main>
    <div class="form-wrapper">
      <h1>Login</h1>
      <p>Welcome back! Please log in to access your account.</p>
      
      <form>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Enter your Email" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" placeholder="Enter your Password" required>
        </div>
        <button type="submit" class="btn btn-yellow" style="width:100%;">Login</button>
      </form>
      
      <div class="form-footer">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
