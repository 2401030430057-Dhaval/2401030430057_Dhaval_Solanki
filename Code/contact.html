<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BrainSync | Contact</title>
  <link rel="stylesheet" href="style.css">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <div class="offer-bar">70% OFF!!! ✚ Sale Ends Soon, Get It Now →</div>
  
  <header class="navbar">
    <div class="logo">BRAIN<span>SYNC</span></div>
    <nav>
      <a href="index.html">Home</a>
      <a href="features.html">Features</a>
      <a href="about.html">About Us</a>
      <a href="pricing.html">Pricing</a>
      <a href="contact.html" class="active">Contact</a>
    </nav>
    <div class="nav-actions">
      <a href="signup.html" class="link-small">Sign Up</a>
      <a href="login.html" class="btn btn-yellow">Login</a>
    </div>
  </header>

  <main class="page-section">
    <h1 class="page-title">Contact Us</h1>
    <p class="page-subtitle">We're here to help! Got a question? Whether you're experiencing issues, we'd love to hear from you.</p>

    <div class="card-grid">
      <div class="card" style="grid-column:1/-1; max-width:680px;">
        <form>
          <div class="form-row">
            <div class="form-group">
              <label>First Name</label>
              <input type="text" placeholder="Enter First Name">
            </div>
            <div class="form-group">
              <label>Last Name</label>
              <input type="text" placeholder="Enter Last Name">
            </div>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>Email</label>
              <input type="email" placeholder="Enter your Email">
            </div>
            <div class="form-group">
              <label>Phone</label>
              <input type="tel" placeholder="Enter Phone Number">
            </div>
          </div>
          <div class="form-group">
            <label>Subject</label>
            <input type="text" placeholder="Enter your Subject">
          </div>
          <div class="form-group">
            <label>Message</label>
            <textarea rows="5" placeholder="Write your Message"></textarea>
          </div>
          <button type="submit" class="btn btn-yellow" style="width:100%;">Send Message</button>
        </form>
      </div>
      <div class="card">
        <h3 class="card-title">Email</h3>
        <p class="card-text">support@brainsync.com</p>
        <h3 class="card-title">Phone</h3>
        <p class="card-text">+92 304 2457335</p>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
